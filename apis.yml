name: Smart & Final Stores
description: >-
  Smart & Final Stores is a warehouse-style food and supply retailer operating
  over 250 stores in the Western United States and 15 stores in northwestern
  Mexico. The company sells a wide variety of fresh perishables, everyday
  grocery items, and warehouse-club-sized products to both households and
  businesses. Smart & Final does not operate a public developer API program but
  participates in grocery industry digital commerce integrations through
  third-party platforms.
